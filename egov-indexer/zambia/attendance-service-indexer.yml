ServiceMaps:
  serviceName: attendance-service
  version: 1.0.0
  mappings:
  - topic: zambia-transformer-producer-attendee-index
    configKey: INDEX
    indexes:
    - name: zambia-attendee-index-v1
      type: attendee
      id: $.attendee.id
      isBulk: true
      jsonPath: $.*
      customJsonMapping:
        indexMapping:
          Data: {}
        fieldMapping:
          - inJsonPath: $
            outJsonPath: $.Data
      timeStampField: $.attendee.auditDetails.createdTime
  - topic: zambia-transformer-producer-attendance-staff-index
    configKey: INDEX
    indexes:
    - name: zambia-staff-index-v1
      type: staff
      id: $.staff.id
      isBulk: true
      jsonPath: $.*
      customJsonMapping:
        indexMapping:
          Data: {}
        fieldMapping:
          - inJsonPath: $
            outJsonPath: $.Data
      timeStampField: $.staff.auditDetails.createdTime
  - topic: zambia-transformer-save-attendance-register
    configKey: INDEX
